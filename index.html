// Central Asset URL manager:
// - Google AI Studio Preview: returns GitHub raw assets URL (https://raw.githubusercontent.com/upmppu-lab/pet4-assets/main/...)
// - PC / Claude / CMD APK Build & APK Runtime: returns local relative path (pets/..., spr/...)
(function() {
  /*__SERVER_ENV_INJECTION__*/
  var RAW_BASE = 'https://raw.githubusercontent.com/upmppu-lab/pet4-assets/main';
  function isRemoteAssets() {
    if (typeof window === 'undefined') return false;
    // 1. Explicit environment configuration provided by server or env-config.js
    if (window.__PET_TOWN_ASSET_MODE === 'remote') return true;
    if (window.__PET_TOWN_ASSET_MODE === 'local') return false;
    // 2. Check for AI Studio Cloud Run preview domain
    var host = (window.location && window.location.hostname) || '';
    if (host.endsWith('.run.app') || host.includes('aistudio') || host.includes('googleusercontent.com')) {
      return true;
    }
    // 3. Any request on localhost / 127.0.0.1 is STRICTLY LOCAL
    if (
      host === 'localhost' ||
      host === '127.0.0.1' ||
      host === '::1' ||
      host === '0.0.0.0' ||
      host.endsWith('.local')
    ) {
      return false;
    }
    // 4. Strict default is ALWAYS LOCAL (PC, Claude, CMD APK build, APK runtime)
    return false;
  }
  function assetUrl(path) {
    if (!path) return '';
    var s = String(path).trim();
    var prefix = RAW_BASE + '/';
    if (s.startsWith('data:') || s.startsWith('blob:')) return s;
    if (s.startsWith('http://') || s.startsWith('https://')) {
      if (s.startsWith(prefix)) {
        return isRemoteAssets() ? s : s.slice(prefix.length);
      }
      return s;
    }
    // Clean leading slashes or accidental assets/ prefix
    s = s.replace(/^\.?\/+/, '');
    if (s.startsWith('assets/')) s = s.slice(7);
    if (isRemoteAssets()) {
      return prefix + s;
    }
    return s;
  }
  window.assetUrl = assetUrl;
  window.isRemoteAssets = isRemoteAssets;
  if (typeof globalThis !== 'undefined') globalThis.assetUrl = assetUrl;
})();
</script>
